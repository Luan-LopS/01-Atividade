
name: Pipeline CD

on: 
  push:
    branches: ['main']
  
permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python 3.13.0
      uses: actions/setup-python@v6
      with: 
        python-version: "3.13.0"
    - name: Install dependencie pyinstaller
      run: | 
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Create APP
      run: pyinstaller --name Mine-2d --onefile main.py
    - name: Upload Exec
      uses: actions/upload-artifact@v6
      with:
        name: Mine-2d
        path: dist/Mine-2d
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: deliver
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Download Exec
      uses: actions/upload-artifact@v6
      with:
        name: Mine-2d
        path: dist/Mine-2d